; PlatformIO Project Configuration File
;
; QRP RF Power and SWR Meter - Rev 2
;
;   pio run              build
;   pio run -t upload    flash over UPDI (programmer on J5)
;
; https://docs.platformio.org/page/projectconf.html

; `pio run` builds only the firmware. The test env is opt-in via
; `pio test -e test`, since it deliberately has no main() to link.
[platformio]
default_envs = ATtiny3224

[env:ATtiny3224]
platform = atmelmegaavr
board = ATtiny3224
framework = arduino

; 10 MHz, not 20. There is no regulator on this board - the ATtiny runs
; straight off the LiPo - and the tinyAVR 2-series only rates 20 MHz at
; VDD >= 4.5 V. 10 MHz is in spec across the whole cell range.
board_build.f_cpu = 10000000L
board_hardware.oscillator = internal

; Brown-out below the usable battery range, so the MCU stops cleanly rather
; than running the display on a collapsing rail.
board_hardware.bod = 2.6v
board_hardware.eesave = yes
board_hardware.updipin = updi

; The Adafruit UPDI Friend and most serial UPDI adapters use this.
; Add "upload_port = COMx" if auto-detection picks the wrong one.
upload_protocol = serialupdi
upload_speed = 115200

; millis() must come from the RTC, not a TCB. The RTC is the only timer that
; keeps counting in standby sleep, and every timeout in the firmware - sample
; ticks, frame ticks, debounce, the idle timers - is a millis delta. With a TCB
; source the clock would freeze the moment the meter slept.
;
; It cannot just be added to build_flags: the platform hardcodes
; -DMILLIS_USE_TIMERB1 in the ATtiny3224 board manifest, and the core rejects
; having two millis timers defined. So restate extra_flags with the RTC in
; place of the TCB. (board_hardware.millistimer does not help - the platform
; only reads it on the dxcore branch.) main.cpp guards this at compile time in
; case it ever comes undone.
board_build.extra_flags = -DARDUINO_attinyxy4 -DMILLIS_USE_TIMERRTC -DUARTBAUD5V

build_flags = -Wall

; No external libraries. Wire is only referenced inside the disabled
; I2C_USE_HARDWARE branch of i2c.cpp; the linker drops it in the default build.


; ---------------------------------------------------------------------------
; Host unit tests:  pio test -e test
;
; Runs the real meter.cpp - calibration curve, SWR, envelope, formatting,
; battery curve and the button debouncer - as an x86 executable on this PC.
; No board required. Everything hardware-facing (i2c, ssd1306, ui, main) is
; excluded; those still need real silicon.
;
; Uses the MinGW toolchain that ships with the windows_x86 platform, so there
; is nothing to install or put on PATH:
;     pio pkg install --global --platform windows_x86
; ---------------------------------------------------------------------------
[env:test]
platform = windows_x86
build_src_filter = +<meter.cpp>
build_flags = -Wall -std=gnu++11
test_build_src = yes


; ---------------------------------------------------------------------------
; Screen simulator:  pio run -e screensim
;                    .pio\build\screensim\program.exe <out_dir>
;
; Compiles the REAL ui.cpp / fonts.cpp / ssd1306.cpp against a fake I2C bus
; that decodes the SSD1306 protocol into a virtual panel, then dumps what the
; module would be displaying. Verifies the layout, the fonts and the
; dirty-page flush without any hardware.
; ---------------------------------------------------------------------------
[env:screensim]
platform = windows_x86
build_src_filter = +<ui.cpp> +<fonts.cpp> +<ssd1306.cpp> +<meter.cpp> +<../sim/>
build_flags = -Wall -std=gnu++11
